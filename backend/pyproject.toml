[project]
name = "luvn-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "openai>=3.20.0",
    "azure-storage-blob>=12.30.3",
    "azure-identity>=1.25.3",
    # azure-identity's async credential needs the azure-core async transport, which
    # imports aiohttp; without it the agent path raises ImportError and silently falls
    # back to the direct call.
    "aiohttp>=3.9",
    "httpx>=0.28.1",
    "pyodbc>=5.3.0",
]

[dependency-groups]
dev = [
    "pytest",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
